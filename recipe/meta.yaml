{% set name = "foamlib" %}
{% set version = "1.8.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/foamlib-{{ version }}.tar.gz
  sha256: 3664cc3f6095ba29d9166b28a54ede74d3ec53683776129789f737fdb02da259

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - uv-build >=0.12,<0.13
    - pip
  run:
    - python >={{ python_min }}
    - aioshutil >=1,<2
    - multicollections >=1.1.6,<2
    - numpy >=1,<3
    - rich >=13,<16
    - typing_extensions >=4.13,<5

test:
  imports:
    - foamlib
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/gerlero/foamlib
  summary: A Python interface for interacting with OpenFOAM
  license: GPL-3.0-or-later
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - gerlero
